[project]
name = "preflight-api"
version = "0.1.0"
description = "Agent Preflight Sandbox API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.5",
  "uvicorn[standard]>=0.32.1",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "pydantic>=2.10.3",
  "pydantic-settings>=2.6.1",
  "httpx>=0.28.1",
  "redis>=5.2.1",
  "temporalio>=1.8.0",
  "litellm>=1.55.0",
  "python-json-logger>=3.2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.8.4",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
